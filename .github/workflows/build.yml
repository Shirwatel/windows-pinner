name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: window-pinner

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run dist

      - name: Upload exe files
        uses: actions/upload-artifact@v4
        with:
          name: window-pinner-windows
          path: |
            window-pinner/dist/WindowPinner-portable.exe
            window-pinner/dist/WindowPinner-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            window-pinner/dist/WindowPinner-portable.exe
            window-pinner/dist/WindowPinner-Setup.exe
